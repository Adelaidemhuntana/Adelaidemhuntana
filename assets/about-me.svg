<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">About Adelaide</title>
  <desc id="desc">A clean pink card describing Adelaide's software engineering, data and cloud learning journey.</desc>

  <defs>
    <linearGradient id="cardBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffafd"/>
      <stop offset="1" stop-color="#fff3f7"/>
    </linearGradient>
    <linearGradient id="focusBackground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde8ef"/>
      <stop offset="1" stop-color="#fff7fa"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="248" rx="26" fill="url(#cardBackground)" stroke="#f2c6d5" stroke-width="2"/>

  <circle cx="1144" cy="42" r="76" fill="none" stroke="#f9dbe5" stroke-width="18" opacity="0.72"/>
  <circle cx="1177" cy="12" r="35" fill="#e83e76" opacity="0.12"/>

  <g transform="translate(34 28)">
    <circle cx="18" cy="18" r="18" fill="#fff1f6" stroke="#f3aec4"/>
    <circle cx="18" cy="13" r="5" fill="none" stroke="#e83e76" stroke-width="2"/>
    <path d="M8 29c1.8-6.1 5.3-9.1 10-9.1s8.2 3 10 9.1" fill="none" stroke="#e83e76" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="82" y="51" fill="#d92e68" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">ABOUT ME</text>
  <line x1="34" y1="70" x2="1166" y2="70" stroke="#f3c8d6"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#4e2433" font-size="15">
    <circle cx="48" cy="104" r="5" fill="#e83e76"/>
    <text x="66" y="100">
      <tspan x="66" dy="0">Software engineering student building a strong</tspan>
      <tspan x="66" dy="22">foundation in programming and problem solving.</tspan>
    </text>

    <circle cx="422" cy="104" r="5" fill="#d92e68"/>
    <text x="440" y="100">
      <tspan x="440" dy="0">Exploring data engineering and cloud technologies</tspan>
      <tspan x="440" dy="22">through practical, real-world projects.</tspan>
    </text>

    <circle cx="820" cy="104" r="5" fill="#b92358"/>
    <text x="838" y="100">
      <tspan x="838" dy="0">Focused on learning, improving and documenting</tspan>
      <tspan x="838" dy="22">my progress as I grow.</tspan>
    </text>
  </g>

  <rect x="34" y="168" width="1132" height="52" rx="14" fill="url(#focusBackground)" stroke="#f3c8d6"/>
  <rect x="34" y="168" width="5" height="52" rx="2.5" fill="#e83e76"/>
  <text x="58" y="190" fill="#9d174d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CURRENT FOCUS</text>
  <text x="58" y="209" fill="#6f3348" font-family="Georgia, serif" font-size="14" font-style="italic">Learning by building real projects in software, data and cloud.</text>
</svg>
