name: Update GitHub profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_profile.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-github-profile
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate project portfolio and statistics
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          PROFILE_OWNER: Adelaidemhuntana
        run: python scripts/update_profile.py

      - name: Commit profile updates
        run: |
          if git diff --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          git commit -m "chore: update profile automatically"
          git push
